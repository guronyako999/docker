server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip-сжатие
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Кэширование статики
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Прокси к backend-сервису (Python + psycopg) — статус PostgreSQL
    # /api/db-status -> http://backend:8000/db-status
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Служебный healthcheck nginx (возвращает 200 всегда, не зависит от статики)
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Основной маршрут: файл -> папка -> если не найдено, отдаём 404-страницу
    location / {
        try_files $uri $uri/ /404.html;
    }

    error_page 404 /404.html;
    error_page 500 502 503 /50x.html;
}
